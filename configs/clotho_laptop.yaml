---
sample_rate: 44100
clip_duration: 6. # change to 10 for Clotho v2
max_caption_len: 80 # change to 60 for Clotho v2

development_datasets:
    Clotho:
        root: "./datasets"
        split: "development"
        num_captions: 5

evaluation_datasets:
    Clotho:
        root: "./datasets"
        split: "evaluation"
        num_captions: 5

audio_encoder:
    name: DAC
    n_quantizers: 2

tokenizer:
    name: BertDAC

model:
    name: Llama
    block_size: 2048
    vocab_size:
    n_layer: 8 # change to 12 for Clotho v2
    n_head: 8 # change to 12 for Clotho v2
    n_embd: 512 # change to 768 for Clotho v2

train:
    device: "cuda"
    num_workers: 0
    loss: ce_loss
    optimizer: AdamW
    lr: 1e-4
    warm_up_steps: 1000
    batch_size_per_device: 1
    mixed_precision: true
    test_every_n_steps: 2000
    save_every_n_steps: 20000
    training_steps: 200000
    resume_ckpt_path: "./checkpoints/train/clotho_laptop/step=100000.pth"
